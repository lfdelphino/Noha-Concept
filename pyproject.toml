[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noha-robot"
version = "2.1.0"
description = "Noha: voice host robot for Raspberry Pi, with dashboard and status board"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4", "websockets>=14,<16"]

[project.scripts]
noha = "noha.cli:main"

[tool.setuptools]
packages = ["noha"]

[tool.setuptools.package-data]
noha = ["portal.html", "logo.png", "web/*.html", "web/*.css", "web/*.js", "web/pages/*.js"]

