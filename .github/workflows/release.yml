name: Publish Noha release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # a hung test must fail the release, not hold it for six hours
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install and check application logic
        run: |
          python -m pip install .
          timeout -s ABRT 600 python -X faulthandler -m unittest discover -s tests -v
      - name: Package version matching the tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG"
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/noha-pi.zip dist/noha-pi.zip.sha256
          --verify-tag --title "Noha $RELEASE_TAG" --generate-notes
