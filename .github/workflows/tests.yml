name: Tests
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Raspberry Pi OS Bookworm ships Python 3.11, Trixie 3.13.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Application logic
        run: timeout -s ABRT 600 python -X faulthandler -m unittest discover -s tests -v
